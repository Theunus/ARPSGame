<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Mirrors theme.colors.bg (ARPS light grey). The one place a colour literal
         is unavoidable: it paints the browser chrome before any script runs. -->
    <meta name="theme-color" content="#f0f2f5" />
    <title>Pour Line — Leaderboard</title>
    <style>
      /* Colour values are set as custom properties from theme.ts at runtime
         (src/leaderboard/main.ts) — this file has no colour literals of its
         own beyond the boot-background fallback, same rule as the rest of the
         app. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Fallback mirrors theme.colors.bg, only visible for the instant before
           main.ts sets --bg. */
        background: var(--bg, #f0f2f5);
        color: var(--text);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      body {
        font-family: var(--font-body, system-ui, -apple-system, sans-serif);
        display: flex;
        flex-direction: column;
        padding: clamp(20px, 3vw, 48px) clamp(24px, 4vw, 72px);
        box-sizing: border-box;
        position: relative;
      }

      /* Corner triangles echoing the ARPS logo motif — faint, fixed to the
         viewport corners, behind everything. Colours come from the theme vars. */
      body::before,
      body::after {
        content: '';
        position: fixed;
        width: clamp(160px, 20vw, 300px);
        height: clamp(160px, 20vw, 300px);
        pointer-events: none;
        z-index: 0;
      }
      body::before {
        top: 0;
        right: 0;
        background: var(--accent-faint);
        clip-path: polygon(100% 0, 0 0, 100% 100%);
      }
      body::after {
        bottom: 0;
        left: 0;
        background: var(--formwork-faint);
        clip-path: polygon(0 100%, 0 0, 100% 100%);
      }

      header,
      .board,
      footer {
        position: relative;
        z-index: 1;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px 32px;
        margin-bottom: clamp(16px, 2.4vw, 32px);
      }

      .titles {
        display: flex;
        align-items: baseline;
        gap: 16px;
      }

      .brand {
        font-family: var(--font-display, system-ui, sans-serif);
        font-size: clamp(22px, 2.4vw, 34px);
        font-weight: 800;
        letter-spacing: 0.28em;
        /* letter-spacing adds trailing space after the last glyph; pull the
           next item back so the gap reads even. */
        margin-right: -0.28em;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-family: var(--font-display, system-ui, sans-serif);
        font-size: clamp(24px, 2.6vw, 36px);
        letter-spacing: 0.12em;
        font-weight: 800;
      }

      .subtitle {
        font-size: clamp(14px, 1.4vw, 18px);
        color: var(--text-dim);
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .status {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: clamp(13px, 1.2vw, 16px);
        color: var(--text-dim);
      }

      .status .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--good);
        animation: pulse 2.2s ease-out infinite;
      }

      #play-nav {
        margin-left: 6px;
        padding: 8px 20px;
        border: none;
        border-radius: 8px;
        background: var(--accent);
        color: var(--on-accent);
        font-family: var(--font-display, system-ui, sans-serif);
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 0.06em;
        cursor: pointer;
      }

      /* --good-glow / --good-glow-clear are the same theme.colors.good hue at
         two alpha levels, computed in main.ts — not a literal here. */
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 var(--good-glow);
        }
        70% {
          box-shadow: 0 0 0 10px var(--good-glow-clear);
        }
        100% {
          box-shadow: 0 0 0 0 var(--good-glow-clear);
        }
      }

      .board {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        border-radius: 16px;
        background: var(--bg-accent);
        border: 1px solid var(--ground-line);
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        position: sticky;
        top: 0;
        background: var(--bg-accent);
        text-align: left;
        font-size: clamp(12px, 1vw, 14px);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--text-dim);
        font-weight: 600;
        padding: 16px 20px;
        border-bottom: 1px solid var(--ground-line);
      }

      th.num,
      td.num {
        text-align: right;
      }

      tbody tr {
        border-bottom: 1px solid var(--ground-line);
      }

      tbody tr:last-child {
        border-bottom: none;
      }

      tbody tr:nth-child(even) {
        background: var(--row-alt);
      }

      td {
        padding: clamp(10px, 1.4vw, 18px) 20px;
        font-size: clamp(16px, 1.6vw, 22px);
        font-variant-numeric: tabular-nums;
      }

      .rank-cell {
        display: flex;
        align-items: center;
      }

      .rank-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.1em;
        height: 2.1em;
        border-radius: 50%;
        font-weight: 800;
        font-size: 0.85em;
        /* Dark ink, legible on every badge fill in both light and dark themes. */
        color: var(--on-accent);
        background: var(--formwork-dim);
      }

      .rank-badge.gold {
        background: var(--rank-gold);
      }
      .rank-badge.silver {
        background: var(--rank-silver);
      }
      .rank-badge.bronze {
        background: var(--rank-bronze);
      }

      .rank-plain {
        padding-left: 0.55em;
        color: var(--text-dim);
        font-weight: 600;
      }

      .name-cell {
        font-weight: 600;
      }

      .score-cell {
        font-weight: 800;
        font-size: clamp(18px, 1.9vw, 26px);
      }

      .combo-cell,
      .moulds-cell {
        color: var(--text-dim);
      }

      footer {
        margin-top: clamp(12px, 1.6vw, 20px);
        display: flex;
        justify-content: space-between;
        font-size: clamp(12px, 1vw, 14px);
        color: var(--text-dim);
      }

      /* Entrance: rows stagger in on first paint so the board doesn't just
         snap into existence — the one moment of "nice" a static table gets. */
      tbody tr {
        opacity: 0;
        animation: rowIn 420ms ease-out forwards;
      }

      @keyframes rowIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Applied briefly to a row whose rank or score changed on a refresh.
         --accent-flash is theme.colors.accent at low alpha, from main.ts. */
      tr.changed {
        animation: changedFlash 1100ms ease-out;
      }

      @keyframes changedFlash {
        0% {
          background: var(--accent-flash);
        }
        100% {
          background: transparent;
        }
      }

      .empty,
      .skeleton-row {
        padding: 40px 20px;
        text-align: center;
        color: var(--text-dim);
        font-size: 18px;
      }

      .skeleton-row td {
        padding: 18px 20px;
      }

      .skeleton-bar {
        height: 1em;
        border-radius: 6px;
        /* ground-line → formwork-dim → ground-line: a subtle mid-grey sweep that
           stays a *lighter* shimmer than its base in both themes (using
           --formwork here would sweep dark navy on the light theme). */
        background: linear-gradient(
          90deg,
          var(--ground-line) 25%,
          var(--formwork-dim) 37%,
          var(--ground-line) 63%
        );
        background-size: 400% 100%;
        animation: shimmer 1.6s ease-in-out infinite;
      }

      @keyframes shimmer {
        0% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }

      @media (max-width: 720px) {
        .combo-cell,
        .moulds-cell,
        th.combo,
        th.moulds {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="titles">
        <span class="brand" id="brand">ARPS</span>
        <h1 id="wordmark">POUR LINE</h1>
        <span class="subtitle">Live Leaderboard</span>
      </div>
      <div class="status">
        <span class="dot"></span>
        <span id="updated-text">Loading…</span>
        <span aria-hidden="true">·</span>
        <span id="count-text"></span>
        <button id="play-nav" type="button">Play</button>
      </div>
    </header>

    <div class="board">
      <table>
        <thead>
          <tr>
            <th scope="col" style="width: 5.5em">Rank</th>
            <th scope="col">Player</th>
            <th scope="col" class="num">Score</th>
            <th scope="col" class="num combo">Best combo</th>
            <th scope="col" class="num moulds">Moulds</th>
          </tr>
        </thead>
        <tbody id="rows">
          <!-- populated by src/leaderboard/main.ts -->
        </tbody>
      </table>
    </div>

    <footer>
      <span>Sample data — not a live competition result</span>
      <span>Refreshes automatically</span>
    </footer>

    <script type="module" src="/src/leaderboard/main.ts"></script>
  </body>
</html>
